name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      # MINECRAFT-569: this PR's LAYERED_DIRT_PATH usage needs layered-slopes' not-yet-released
      # dirt-path addition (layered-slopes PR #3) -- the real pinned gradle.properties version
      # (0.2.0) predates that class and cannot compile this PR. Same pattern dynamic-terrain used
      # for MINECRAFT-499 (review comment 52571, commit bc9263c): check out the exact paired PR
      # branch/commit, build it, and build/test this mod against that real jar via
      # -PlayeredslopesLocalJar, proving compile+runtime compatibility against the actual source
      # now rather than waiting on a release or touching the real pin. Remove this checkout step
      # and the -PlayeredslopesLocalJar flags below, once layered-slopes#3 merges and releases and
      # gradle.properties is repinned to that real version+sha512.
      - name: Checkout paired Layered Slopes PR (MINECRAFT-569 dirt-path integration validation)
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/layered-slopes
          ref: 64f5bba00124277fe508528b2ed5a3f7449472c4
          path: layered-slopes-paired

      - name: Build paired Layered Slopes
        run: cd layered-slopes-paired && ./gradlew build --no-daemon

      - name: Build and test (against paired Layered Slopes PR artifact)
        run: ./gradlew build --no-daemon -PlayeredslopesLocalJar=layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar

      # MINECRAFT-511 (Jira comments 52878/52881 on this ticket): real runtime proof -- not just
      # compile-time -- that this mod resolves ordinary vanilla-block grading with Layered
      # Slopes ALONE. Dynamic Terrain is never installed in this run; the server boots with only
      # this mod and Layered Slopes. Gradle reports BUILD SUCCESSFUL even when the GameTest
      # server fails to start or ran zero tests, so check_gametest_count.py fails closed unless
      # both named standalone tests actually ran and passed.
      - name: Run GameTests (standalone, no Dynamic Terrain)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon -PlayeredslopesLocalJar=layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: layered-slope-grading
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  # MINECRAFT-557: a real disposable server + real disposable client (headless via Xvfb),
  # proving the real client-prediction interaction seam (MultiPlayerGameMode#useItemOn) cancels
  # an eligible shovel click without locally mutating the world or consuming durability, while
  # the server's own authoritative push still lands and syncs back -- not just that the server-
  # only GameTests and the `if (!level.isClientSide())` source guard look right. Pattern ported
  # from layered-slopes' own client-acceptance job (MINECRAFT-499 / Wroosbit gap 1).
  client-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install virtual display and software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri libopenal1
      # MINECRAFT-569: same paired-PR reason as the build job above -- main sources reference
      # LAYERED_DIRT_PATH, which only exists in layered-slopes' unreleased PR #3, not the real pin.
      - name: Checkout paired Layered Slopes PR (MINECRAFT-569 dirt-path integration validation)
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/layered-slopes
          ref: 64f5bba00124277fe508528b2ed5a3f7449472c4
          path: layered-slopes-paired
      - name: Build paired Layered Slopes
        run: cd layered-slopes-paired && ./gradlew build --no-daemon
      # acceptance.py below launches its own `./gradlew runServer`/`runClient` subprocesses with a
      # fixed arg list it does not accept overrides for, so the paired-jar override is exported as
      # the Gradle-recognized ORG_GRADLE_PROJECT_* env var instead of a -P flag, covering every
      # gradlew invocation (this step's and acceptance.py's) in this job uniformly.
      - name: Compile test-only client harness
        env:
          ORG_GRADLE_PROJECT_layeredslopesLocalJar: layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar
        run: ./gradlew classes -PclientAcceptance --no-daemon -Dorg.gradle.jvmargs=-Xmx1G
      - name: Run disposable local server and real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          ORG_GRADLE_PROJECT_layeredslopesLocalJar: layered-slopes-paired/build/libs/layeredslopes-0.0.0.jar
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/client-smoke/acceptance.py
      - name: Preserve client acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-acceptance
          path: |
            client-acceptance-*.log
            run-acceptance-client/client-acceptance-*.json
            run-acceptance-client/client-acceptance-failure.txt
            run-acceptance-client/logs/latest.log
            run-acceptance-server/logs/latest.log
          if-no-files-found: warn
