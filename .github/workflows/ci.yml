name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      # MINECRAFT-511 (Jira comments 52878/52881 on this ticket): real runtime proof -- not just
      # compile-time -- that this mod resolves ordinary vanilla-block grading with Layered
      # Slopes ALONE. Dynamic Terrain is never installed in this run; the server boots with only
      # this mod and Layered Slopes. Gradle reports BUILD SUCCESSFUL even when the GameTest
      # server fails to start or ran zero tests, so check_gametest_count.py fails closed unless
      # both named standalone tests actually ran and passed.
      - name: Run GameTests (standalone, no Dynamic Terrain)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: layered-slope-grading
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  # MINECRAFT-557: a real disposable server + real disposable client (headless via Xvfb),
  # proving the real client-prediction interaction seam (MultiPlayerGameMode#useItemOn) cancels
  # an eligible shovel click without locally mutating the world or consuming durability, while
  # the server's own authoritative push still lands and syncs back -- not just that the server-
  # only GameTests and the `if (!level.isClientSide())` source guard look right. Pattern ported
  # from layered-slopes' own client-acceptance job (MINECRAFT-499 / Wroosbit gap 1).
  client-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install virtual display and software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri libopenal1
      - name: Compile test-only client harness
        run: ./gradlew classes -PclientAcceptance --no-daemon -Dorg.gradle.jvmargs=-Xmx1G
      - name: Run disposable local server and real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/client-smoke/acceptance.py
      - name: Preserve client acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-acceptance
          path: |
            client-acceptance-*.log
            run-acceptance-client/client-acceptance-*.json
            run-acceptance-client/client-acceptance-failure.txt
            run-acceptance-client/logs/latest.log
            run-acceptance-server/logs/latest.log
          if-no-files-found: warn
